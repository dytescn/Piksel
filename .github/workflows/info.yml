name: Upload Info

on:
  push:
    branches:
      - main

jobs:
  upload-info:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 jq（你原来漏了这个）
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. 读取 version
      - name: Read version from JSON
        id: version
        run: |
          PROJECT=$(jq -r '.name' dytes.json)
          VERSION=$(jq -r '.version' dytes.json)

          if [[ -z "$PROJECT" || -z "$VERSION" ]]; then
            echo "ERROR: name or version empty in dytes.json"
            exit 1
          fi

          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 4. 准备上传目录（关键修复点）
      - name: Prepare upload directory
        run: |
          mkdir -p upload
          cp dytes.json upload/${{ steps.version.outputs.project }}.json

      # 5. 上传到 UpYun S3
      - name: Upload dytes.json to UpYun S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload
          destination_dir: app
          endpoint: https://s3.api.upyun.com
