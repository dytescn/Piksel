name: Release Piksel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piksel-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            binary: piksel.exe
          - os: ubuntu-latest
            platform: linux
            binary: piksel
          - os: macos-latest
            platform: mac
            binary: piksel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgdk-pixbuf2.0-dev \
            libatk1.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          project=$(node -p "require('./dytes.json').name")
          version=$(node -p "require('./dytes.json').version")
          cargo_version=$(cargo metadata --format-version 1 --no-deps \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.packages.find(p=>p.name==="piksel").version)})')

          echo "manifest=$version cargo=$cargo_version"
          test "$version" = "$cargo_version"

          # tag 发布时，tag 名必须与版本一致（v1.1.13）
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo "### cargo build failed (${{ matrix.platform }})"
            echo '```text'
            grep -n -E 'error(\[|:)|could not compile|failed to select|panicked at' build.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'error(\[|:)|could not compile|failed to select|panicked at' build.log | head -5 | while IFS= read -r line; do
            echo "::error title=cargo build (${RUNNER_OS})::${line}"
          done

      - name: Prepare upload directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          cp "target/release/${{ matrix.binary }}" upload/
          ls -l upload

      - name: Upload binary to UpYun S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload
          destination_dir: core/${{ steps.version.outputs.project }}/${{ steps.version.outputs.version }}/${{ matrix.platform }}
          endpoint: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}

  publish-manifest:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package info
        id: package
        shell: bash
        run: |
          set -euo pipefail
          project=$(node -p "require('./dytes.json').name")
          version=$(node -p "require('./dytes.json').version")
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload-manifest
          cp dytes.json "upload-manifest/${{ steps.package.outputs.project }}.json"
          ls -l upload-manifest

      - name: Upload manifest to UpYun S3
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload-manifest
          destination_dir: app
          endpoint: ${{ secrets.UPYUN_ENDPOINT || 'https://s3.api.upyun.com' }}
